name: Tag version

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ssh-key: ${{ secrets.TAG_RELEASE_DEPLOY_KEY }}

      - name: Tag version bump
        run: ./scripts/tag-version.sh
